name: Extract project

on:
  workflow_dispatch:
  push:
    paths:
      - "tegen-updated.zip"

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o tegen-updated.zip -d extracted
          cp -a extracted/tegen-main/. .
          rm -rf extracted tegen-updated.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract TEGEN project" || echo "No changes to commit"
          git push
